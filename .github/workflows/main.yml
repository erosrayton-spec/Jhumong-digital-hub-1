name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Auto-fix Gradle files
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JhumongAIVideoMaker"
          EOF
          if [ -f app/build.gradle.kts ]; then echo 'include(":app")' >> settings.gradle.kts; fi
          sed -i -E 's/id\("com\.android\.application"\)( version "[^"]*")?/id("com.android.application") version "8.5.2"/' build.gradle.kts
          sed -i -E 's/id\("org\.jetbrains\.kotlin\.android"\)( version "[^"]*")?/id("org.jetbrains.kotlin.android") version "1.9.24"/' build.gradle.kts
          grep -q useAndroidX gradle.properties 2>/dev/null || echo "android.useAndroidX=true" >> gradle.properties

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
